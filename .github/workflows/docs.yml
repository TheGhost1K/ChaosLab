name: Deploy Documentation to Pages

on:
  # Запускается при push в master, если изменились исходники или docs
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  # Позволяет запускать вручную из вкладки Actions
  workflow_dispatch:

# Разрешения, необходимые для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Убирает баннер .NET
  DOTNET_NOLOGO: true
  # Отключает телеметрию
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Пропускает инициализацию CLI
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Общий кэш NuGet между job'ами
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Отключает приветственное сообщение MSBuild
  MSBUILDTERMINALLOGGER: 'off'
  EnableWindowsTargeting: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore
        run: dotnet restore

      - name: Build library
        run: dotnet build src/ChaosLab/ChaosLab.csproj -c Release --no-restore

      - name: Build docs
        run: docfx docs/docfx.json

      - name: Add .nojekyll
        shell: pwsh
        run: |
          New-Item -ItemType File -Path docs/_site/.nojekyll -Force | Out-Null
          Write-Host "Created .nojekyll"
          Get-ChildItem docs/_site | Select-Object Name

      - name: Verify api/index.html exists
        shell: pwsh
        run: |
          $apiIndex = "docs/_site/api/index.html"
          if (-not (Test-Path $apiIndex)) {
            Write-Error "FATAL: $apiIndex not found!"
            Write-Host "Contents of docs/_site/api/:"
            Get-ChildItem docs/_site/api -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }
          Write-Host "OK: $apiIndex exists ($((Get-Item $apiIndex).Length) bytes)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
